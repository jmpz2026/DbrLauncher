# Configuration file

calidad {
    # Animated block and item textures (water, lava, fire, portal).
    B:animations=false

    # Glyph widths from the resource pack (textures/font/ascii.properties).
    B:custom_fonts=false

    # World fog. false = no distance fog (water, lava and blindness keep theirs).
    B:fog=false

    # Sky dome. Dimensions with their own sky renderer (DBC planets) keep it.
    B:sky=false
    B:stars=false
    B:sun_moon=false

    # Rain and snow drawing and rain splash particles. Sounds stay.
    B:weather=false
}


rendimiento {
    # Chunk rebuild time per frame in ms. 0 = automatic.
    I:chunk_budget_ms=0

    # Chunk mesh threads: 0 = automatic, else index - 1 threads. Needs a restart. -Ddbro.threads wins.
    I:chunk_threads=2

    # FPS cap independent of the vanilla slider and VSync. 0 = vanilla. Values 10..20 count as 30.
    I:fps_cap=60

    # Lower FPS without focus (30), minimized (10) and in the pause menu (60).
    B:reducer=true
}


zoom {
    I:factor=4

    # Cinematic camera while zoomed.
    B:smooth=false
}


