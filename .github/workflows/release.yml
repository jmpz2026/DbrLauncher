name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

jobs:
  # electron-builder crea el release si no existe. Con los dos builds en paralelo ambos listaban
  # /releases a la vez, ninguno lo encontraba y los dos hacían POST: el segundo se estrellaba con
  # "422 already_exists" y perdía sus artefactos. Creándolo aquí primero, ambos builds ya lo
  # encuentran y solo suben ficheros.
  create-release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Crear el release si falta
        run: gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}

  build-win:
    runs-on: windows-latest
    needs: create-release
    if: ${{ !failure() && !cancelled() }} # create-release se salta en workflow_dispatch sin tag
    permissions:
      contents: write # crear el release y subir el instalador
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Compilar app
        run: npm run build

      - name: Empaquetar y publicar (.exe + latest.yml)
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EP_GH_IGNORE_TIME: 'true' # permite re-run sobre un release de más de 2 h

  build-linux:
    runs-on: ubuntu-latest
    needs: create-release
    if: ${{ !failure() && !cancelled() }}
    permissions:
      contents: write # crear el release y subir el AppImage
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Compilar app
        run: npm run build

      - name: Empaquetar y publicar (.AppImage + latest-linux.yml)
        run: npx electron-builder --linux --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EP_GH_IGNORE_TIME: 'true'
