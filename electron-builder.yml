appId: net.dbr.launcher
productName: Dbr Launcher
directories:
  buildResources: build
# Lista blanca: solo el build y package.json (electron-builder añade las dependencias de
# producción por su cuenta). Con una lista de exclusiones se colaba todo lo demás de la carpeta
# (.npmcache, .claude, scripts, docs): el app.asar local llegó a pesar 736 MB.
files:
  - out/**
  - package.json
asar: true
compression: maximum
# Sin el .pak del idioma, app.getLocale() cae a en-US y el primer arranque sale en inglés.
electronLanguages:
  - en-US
  - es
  - es-419
  - pt-BR
  - pt-PT
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-setup.${ext}
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Game
  maintainer: Dbr <jmpz2026@users.noreply.github.com> # el .deb exige un mantenedor con email
  artifactName: ${productName}-${version}.${ext}
deb:
  artifactName: dbr-launcher_${version}_${arch}.${ext} # convención Debian, sin espacios
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
publish:
  provider: github
  owner: jmpz2026
  repo: DbrLauncher
  releaseType: release # publica el release directo (no como borrador)
