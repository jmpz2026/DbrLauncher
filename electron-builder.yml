appId: net.dbr.launcher
productName: Dbr Launcher
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{.gitignore,README.md,tailwind.config.js,postcss.config.js}'
asar: true
compression: maximum
electronLanguages:
  - en-US
  - es
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-setup.${ext}
mac:
  target: dmg
  category: public.app-category.games
  artifactName: ${productName}-${version}.${ext}
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Game
  maintainer: Dbr <jmpz2026@users.noreply.github.com> # el .deb exige un mantenedor con email
  artifactName: ${productName}-${version}.${ext}
deb:
  artifactName: dbr-launcher_${version}_${arch}.${ext} # convención Debian, sin espacios
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
publish:
  provider: github
  owner: jmpz2026
  repo: DbrLauncher
  releaseType: release # publica el release directo (no como borrador)
